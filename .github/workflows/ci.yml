name: Test and Scan

on:
  push:
    branches:
      - 'main'
permissions:
    contents: read
jobs:
    run_tests:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          service: [tasks-api, title-normalizer] # ${{matrix.service}}
          python-version: [3.12, 3.11, 3.8]
      steps:
        - uses: actions/checkout@v7  
        - uses: actions/setup-python@v7
          with:
            python-version: ${{matrix.python-version}} #creates 6 jobs
        - run: pip install -r services/${{matrix.service}}/requirements.txt
        - run: pytest services/${{matrix.service}}
        #- shell: bash  
          run: pytest -rA services/${{matrix.services}} | tee ${{matrix.services}} test-report.txt
        - uses: actions/upload-artifact@v7
          if: always()
          with:
            name: ${{matrix.services}}-${{matrix.python-version}}-test-report
            path: ${{matrix.services}}-${{matrix.python-version}}-test-report.txt


  #matric to run multiple services wothout writing the separate code blocks for each
  #basically matrixes are for multiple jobs



